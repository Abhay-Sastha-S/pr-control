name: Checks

on:
  push:
    branches: [main]
    tags: ['pr-control--v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Pipeline, page smoke test, and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Manifests, pipeline compile, and the no-org-data guard
        run: node scripts/check-release.mjs

      - name: Pipeline end-to-end on synthetic fixtures
        run: ./tests/run-pipeline.sh

      # Mirrors the check the community-marketplace review pipeline runs.
      # Advisory on branches and PRs because it depends on an external npm
      # install; a release must not ship a rejected manifest, so tags gate.
      - name: Claude Code plugin validation
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict

  release:
    name: Publish the GitHub release
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build release notes from the changelog
        run: node scripts/release-notes.mjs > RELEASE_NOTES.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "PR Control ${GITHUB_REF_NAME#pr-control--v}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
